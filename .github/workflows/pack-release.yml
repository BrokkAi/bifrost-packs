name: Pack source release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate and stage independent content release
        run: |
          set -euo pipefail
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          fi
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/content.py verify
          python3 scripts/verify-native.py
          archive="$RUNNER_TEMP/bifrost.public-${version}-source.tar.gz"
          python3 scripts/content.py bundle --output "$archive"
          python3 scripts/content.py bundle --output "$RUNNER_TEMP/repeated.tar.gz"
          cmp "$archive" "$RUNNER_TEMP/repeated.tar.gz"
          python3 release-contract/release.py create --archive "$archive" \
            --version "$version" --output "$RUNNER_TEMP/pack-release.json" > "$RUNNER_TEMP/release-summary.json"
          python3 release-contract/release.py verify-artifact \
            --manifest "$RUNNER_TEMP/pack-release.json" --artifact "$archive"
          cd "$RUNNER_TEMP"
          sha256sum "${archive##*/}" > "${archive##*/}.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pack-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bifrost.public-*-source.tar.gz
            ${{ runner.temp }}/bifrost.public-*-source.tar.gz.sha256
            ${{ runner.temp }}/pack-release.json
          if-no-files-found: error
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'BrokkAi/bifrost-packs' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: pack-release-${{ github.sha }}
          path: dist
      - name: Publish explicitly tagged source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c bifrost.public-*-source.tar.gz.sha256
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" bifrost.public-*-source.tar.gz \
            bifrost.public-*-source.tar.gz.sha256 pack-release.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" \
            --notes "Source content from $GITHUB_SHA. Qualification pending; source artifacts are not enabled runtime packs."
