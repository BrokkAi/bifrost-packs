name: Rules release
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [rules]
        required: true
      version:
        type: string
        default: '0.1.2'
        required: true
  push:
    tags:
      - 'rules/v*.*.*'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate and build selected release stream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          component="$INPUT_COMPONENT"
          if [[ "$component" == packs ]]; then
            echo "Use Generate native packs for independently generated packs" >&2
            exit 2
          fi
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            component="${GITHUB_REF_NAME%%/*}"
            version="${GITHUB_REF_NAME#*/v}"
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          fi
          [[ "$component" == rules || "$component" == packs ]]
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          python3 -B scripts/content.py verify
          python3 -B scripts/verify-native.py
          args=()
          if jq -e .baseline "release-config.${component}.json" >/dev/null; then
            baseline=$(jq -r .baseline "release-config.${component}.json")
            repo=$(jq -r .repository "$baseline")
            repo="${repo#https://github.com/}"
            commit=$(jq -r .commit "$baseline")
            tag=$(jq -r .tag "$baseline")
            actual=$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)
            test "$actual" = "$commit"
            if [[ "$component" == rules ]]; then
              gh api "repos/$repo/tarball/$commit" > "$RUNNER_TEMP/source.tar.gz"
              args=(--source-archive "$RUNNER_TEMP/source.tar.gz")
            else
              asset=$(jq -r .native_asset "$baseline")
              gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$RUNNER_TEMP"
              args=(--native-archive "$RUNNER_TEMP/$asset")
            fi
          fi
          python3 -B scripts/build-release.py --component "$component" --version "$version" \
            --output "$RUNNER_TEMP/dist" "${args[@]}"
          python3 -B scripts/build-release.py --component "$component" --version "$version" \
            --output "$RUNNER_TEMP/repeat" "${args[@]}"
          diff -r "$RUNNER_TEMP/dist" "$RUNNER_TEMP/repeat"
          archive=$(find "$RUNNER_TEMP/dist" -name '*.tar.gz')
          python3 -B release-contract/release.py verify-artifact \
            --manifest "$RUNNER_TEMP/dist/pack-release.json" --artifact "$archive"
      - name: Test current locked rules with matching Bifrost v0.12 binary
        if: ${{ startsWith(github.ref_name, 'rules/') || inputs.component == 'rules' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          engine_asset=bifrost-v0.12.0-x86_64-unknown-linux-gnu.tar.gz
          engine_checksum=6938fdbda79ee008f9e2d13abe87b341aec7765946859d918cee90da9fa8b503
          gh release download v0.12.0 --repo BrokkAi/bifrost \
            --pattern "$engine_asset" --pattern "$engine_asset.sha256" --dir "$RUNNER_TEMP"
          test "$(awk '{print $1}' "$RUNNER_TEMP/$engine_asset.sha256")" = "$engine_checksum"
          (cd "$RUNNER_TEMP" && sha256sum -c "$engine_asset.sha256")
          mkdir "$RUNNER_TEMP/engine" "$RUNNER_TEMP/rules"
          tar -xzf "$RUNNER_TEMP/$engine_asset" -C "$RUNNER_TEMP/engine"
          tar -xzf "$RUNNER_TEMP"/dist/bifrost.public.rules-*-source.tar.gz -C "$RUNNER_TEMP/rules"
          binary=$(find "$RUNNER_TEMP/engine" -type f -name bifrost)
          python3 -B scripts/smoke.py --binary "$binary" --root "$RUNNER_TEMP/rules" --output "$RUNNER_TEMP/smoke"
          python3 -B release-contract/attach_smoke.py --manifest "$RUNNER_TEMP/dist/pack-release.json" \
            --evidence "$RUNNER_TEMP/smoke" --output "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: component-release-${{ github.sha }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.repository == 'BrokkAi/bifrost-packs' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: component-release-${{ github.sha }}
          path: dist
      - name: Verify exact published dependency and publication integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dependency_version=$(jq -r '.release_dependencies[0].release_version' dist/pack-release.json)
          mkdir "$RUNNER_TEMP/dependency"
          gh release download "packs/v$dependency_version" --repo "$GITHUB_REPOSITORY" \
            --pattern pack-release.json --dir "$RUNNER_TEMP/dependency"
          while IFS= read -r asset; do
            gh release download "packs/v$dependency_version" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir "$RUNNER_TEMP/dependency"
          done < <(jq -r '.artifacts[].name' "$RUNNER_TEMP/dependency/pack-release.json")
          python3 -B release-contract/publication.py --manifest "$RUNNER_TEMP/dependency/pack-release.json" \
            --directory "$RUNNER_TEMP/dependency"
          dependency_commit=$(jq -r .source.commit "$RUNNER_TEMP/dependency/pack-release.json")
          test "$(git rev-parse "packs/v${dependency_version}^{commit}")" = "$dependency_commit"
          python3 -B release-contract/publication.py --manifest dist/pack-release.json --directory dist \
            --dependency-manifest "$RUNNER_TEMP/dependency/pack-release.json"
      - name: Publish tagged component release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B release-contract/release_notes.py --manifest dist/pack-release.json --output dist/release-notes.md
          cd dist
          sha256sum -c *.sha256
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.tar.gz *.sha256 *.json *.txt *.rqlp *.py \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" \
            --notes-file release-notes.md
