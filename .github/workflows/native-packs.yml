name: Generate native packs
on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent pack release version (raw generation evidence only until native migration)
        required: true
        default: '0.9.0'
  # Regenerate only when generator inputs or packs release tooling change; content.yml
  # runs content verification and the unit tests on every pull request and push.
  pull_request:
    paths: ['native-generation.json', 'release-config.packs.json', 'semantic-packs/**', 'scripts/upstream/**', 'release-contract/**', 'scripts/content.py', 'scripts/audit_tuple.py', '.github/workflows/native-packs.yml']
  # A pull request can restore only caches saved on its own merge ref or on main,
  # so main saves the producer and upstream inputs for later pull requests.
  push:
    branches: [main]
    tags: ['packs/v*.*.*']
    paths: ['native-generation.json', 'release-config.packs.json', 'semantic-packs/**', 'scripts/upstream/**', 'release-contract/**', 'scripts/content.py', 'scripts/audit_tuple.py', '.github/workflows/native-packs.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch exact executing workflow revision
        run: git fetch --no-tags origin "$GITHUB_WORKFLOW_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify repository content
        run: |
          python3 -B scripts/content.py verify
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: inputs-cache
        with:
          path: ${{ runner.temp }}/native-input-cache
          key: native-inputs-linux-v1-${{ hashFiles('scripts/upstream/**', 'semantic-packs/**/*.json') }}
          # Every cached archive is reused only after its pinned checksum matches, so an older
          # input set is safe to start from; a missing or stale archive is fetched again.
          restore-keys: native-inputs-linux-v1-
      # native-generation.json pins the released Linux x86_64 producer by
      # archive and executable SHA-256; native_generation.py checks the
      # executable again before it generates.
      - name: Download exact released generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=$(jq -r .generator.repository native-generation.json)
          repo=${repo#https://github.com/}
          version=$(jq -r .generator.version native-generation.json)
          asset=$(jq -r .generator.asset native-generation.json)
          test "$asset" = "bifrost-semantic-pack-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir "$RUNNER_TEMP/generator-download" "$RUNNER_TEMP/generator"
          gh release download "v$version" --repo "$repo" --pattern "$asset" --dir "$RUNNER_TEMP/generator-download"
          echo "$(jq -r .generator.asset_sha256 native-generation.json)  $RUNNER_TEMP/generator-download/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/generator-download/$asset" -C "$RUNNER_TEMP/generator-download"
          binary=$(find "$RUNNER_TEMP/generator-download" -type f -name bifrost-semantic-pack)
          echo "$(jq -r .generator.binary_sha256 native-generation.json)  $binary" | sha256sum -c -
          cp "$binary" "$RUNNER_TEMP/generator/bifrost-semantic-pack"
          echo "BIFROST_SEMANTIC_PACK_BIN=$RUNNER_TEMP/generator/bifrost-semantic-pack" >> "$GITHUB_ENV"
          echo "SEMANTIC_PACK_SOURCE_CACHE=$RUNNER_TEMP/native-input-cache" >> "$GITHUB_ENV"
      - name: Generate twice, verify and compare native content
        run: |
          python3 -B release-contract/native_generation.py --root . \
            --config native-generation.json --binary "$BIFROST_SEMANTIC_PACK_BIN" \
            --output "$RUNNER_TEMP/native"
      - name: Save upstream inputs for later pull requests
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.inputs-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/native-input-cache
          key: ${{ steps.inputs-cache.outputs.cache-primary-key }}
      - name: Record runner disk after generation
        if: ${{ always() }}
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Index generated packs with independent compatibility requirements
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT_VERSION:-0.9.0}
          if [[ "$GITHUB_REF" == refs/tags/packs/* ]]; then
            version=${GITHUB_REF_NAME#packs/v}
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          fi
          python3 -B release-contract/native_release.py --root . \
            --config release-config.packs.json --version "$version" \
            --archive "$RUNNER_TEMP/native/native.tar.gz" \
            --receipt "$RUNNER_TEMP/native/generation.json" --output "$RUNNER_TEMP/dist"
          python3 -B release-contract/publication.py \
            --manifest "$RUNNER_TEMP/dist/pack-release.json" --directory "$RUNNER_TEMP/dist"
          python3 -B scripts/audit_tuple.py --manifest "$RUNNER_TEMP/dist/pack-release.json" \
            --output "$RUNNER_TEMP/native-integrity-audit.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: generated-native-packs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Stage raw generation evidence while native runtime migration is pending
        if: ${{ !startsWith(github.ref, 'refs/tags/packs/') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-generation-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/native/**
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/packs/') && github.repository == 'BrokkAi/bifrost-packs' }}
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: generated-native-packs-${{ github.sha }}
          path: dist
      - name: Check version-independent native publication
        run: python3 -B release-contract/publication.py --manifest dist/pack-release.json --directory dist
      - name: Publish generated native packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B release-contract/release_notes.py --manifest dist/pack-release.json --output dist/release-notes.md \
            --context-notes "$(jq -r .notes release-config.packs.json)"
          cd dist
          sha256sum -c *.sha256
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.tar.gz *.sha256 *.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" \
            --notes-file release-notes.md
