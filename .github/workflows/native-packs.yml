name: Generate native packs
on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent pack release version (stages only)
        required: true
        default: '0.2.0'
  pull_request:
    paths: ['native-generation.json', 'release-contract/**', 'semantic-packs/**', 'scripts/upstream/**', '.github/workflows/native-packs.yml']
  push:
    tags: ['packs/v*.*.*']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify repository content
        run: |
          python3 -B scripts/content.py verify
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch pinned generator independently of consumer compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=$(jq -r .generator.repository native-generation.json)
          repo=${repo#https://github.com/}
          version=$(jq -r .generator.version native-generation.json)
          commit=$(jq -r .generator.commit native-generation.json)
          test "$(gh api "repos/$repo/commits/v$version" --jq .sha)" = "$commit"
          asset=$(jq -r .generator.asset native-generation.json)
          hash=$(jq -r .generator.asset_sha256 native-generation.json)
          gh release download "v$version" --repo "$repo" --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "$hash  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir "$RUNNER_TEMP/generator"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/generator"
          binary=$(find "$RUNNER_TEMP/generator" -type f -name bifrost-semantic-pack)
          test -x "$binary"
          echo "BIFROST_SEMANTIC_PACK_BIN=$binary" >> "$GITHUB_ENV"
      - name: Generate twice, verify and compare native content
        run: |
          python3 -B release-contract/native_generation.py --root . \
            --config native-generation.json --binary "$BIFROST_SEMANTIC_PACK_BIN" \
            --output "$RUNNER_TEMP/native"
      - name: Index generated packs with independent compatibility requirements
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT_VERSION:-0.2.0}
          if [[ "$GITHUB_REF" == refs/tags/packs/* ]]; then
            version=${GITHUB_REF_NAME#packs/v}
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          fi
          python3 -B release-contract/native_release.py --root . \
            --config release-config.packs.json --version "$version" \
            --archive "$RUNNER_TEMP/native/native.tar.gz" \
            --receipt "$RUNNER_TEMP/native/generation.json" --output "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: generated-native-packs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/packs/') && github.repository == 'BrokkAi/bifrost-packs' }}
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: generated-native-packs-${{ github.sha }}
          path: dist
      - name: Publish generated native packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c *.sha256
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.tar.gz *.sha256 *.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" \
            --notes "Independently generated packs from $GITHUB_SHA. Generator provenance and unchanged measurements included. Native content reproducibility verified; full consumer behavior qualification remains pending."
