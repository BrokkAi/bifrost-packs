name: Content integrity and release contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test integrity and compatibility failure handling
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated rule inventory
        run: |
          python3 -B -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 -B tools/rule_stats.py --check
      - name: Verify locked content and native shard bytes
        run: |
          python3 scripts/content.py verify
          python3 scripts/verify-native.py
          for script in scripts/upstream/public/*.sh scripts/upstream/lib/*.sh; do bash -n "$script"; done
          node --check scripts/upstream/public/generate-go-atomic-semantic-pack.mjs
      - name: Build and compare source archives
        run: |
          python3 scripts/content.py bundle --output "$RUNNER_TEMP/bifrost.public-0.1.0-source.tar.gz"
          python3 scripts/content.py bundle --output "$RUNNER_TEMP/repeated.tar.gz"
          cmp "$RUNNER_TEMP/bifrost.public-0.1.0-source.tar.gz" "$RUNNER_TEMP/repeated.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bifrost-packs-source-${{ github.sha }}
          path: ${{ runner.temp }}/bifrost.public-0.1.0-source.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Stage shared source-release metadata
        run: |
          python3 release-contract/release.py create \
            --archive "$RUNNER_TEMP/bifrost.public-0.1.0-source.tar.gz" \
            --output "$RUNNER_TEMP/pack-release.json" > "$RUNNER_TEMP/release-summary.json"
          python3 release-contract/release.py verify-artifact \
            --manifest "$RUNNER_TEMP/pack-release.json" \
            --artifact "$RUNNER_TEMP/bifrost.public-0.1.0-source.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pack-release-contract-${{ github.sha }}
          path: ${{ runner.temp }}/pack-release.json
          if-no-files-found: error
